# CADRO reverse proxy (staging / controlled pilot).
#
# Serves static assets and public files straight from the bench volume, proxies the
# application to gunicorn (backend:8000) and realtime to socket.io (socketio:9000).
# TLS is expected to be terminated in front of this container.

# Backends are resolved at request time through Docker's DNS, so recreating the bench or
# socketio container (new IP) does not leave nginx pointing at the old address.
resolver 127.0.0.11 valid=10s ipv6=off;

# Brute-force protection for the login endpoint: 10 requests per minute per client address,
# with a burst of 10. Everything else is unlimited here; put a WAF/CDN in front for DDoS.
limit_req_zone $binary_remote_addr zone=cadro_login:10m rate=10r/m;
# Payment provider webhooks: 60 requests per minute per client address, burst 20.
limit_req_zone $binary_remote_addr zone=cadro_webhook:10m rate=60r/m;
limit_req_status 429;

server {
    listen 8001;
    server_name _;

    include /etc/nginx/cadro/cadro-server.inc;
}
