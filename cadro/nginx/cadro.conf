# CADRO reverse proxy (staging / controlled pilot).
#
# Serves static assets and public files straight from the bench volume, proxies the
# application to gunicorn (backend:8000) and realtime to socket.io (socketio:9000).
# TLS is expected to be terminated in front of this container.

# Backends are resolved at request time through Docker's DNS, so recreating the bench or
# socketio container (new IP) does not leave nginx pointing at the old address.
resolver 127.0.0.11 valid=10s ipv6=off;

# Brute-force protection for the login endpoint: 10 requests per minute per client address,
# with a burst of 10. Everything else is unlimited here; put a WAF/CDN in front for DDoS.
limit_req_zone $binary_remote_addr zone=cadro_login:10m rate=10r/m;
limit_req_status 429;

server {
    listen 8001;
    server_name _;

    root /home/frappe/cadro-data/frappe-bench/sites;

    client_max_body_size 50m;
    proxy_buffer_size 128k;
    proxy_buffers 4 256k;
    proxy_busy_buffers_size 256k;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;
    server_tokens off;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;
    gzip_min_length 1024;

    location /assets {
        try_files $uri =404;
        add_header Cache-Control "max-age=31536000";
    }

    # Private files are authorised by the application, then served by nginx (X-Accel-Redirect).
    location ~ ^/protected/(.*) {
        internal;
        try_files /$host/$1 =404;
    }

    location = /api/method/login {
        limit_req zone=cadro_login burst=10 nodelay;
        try_files /cadro-no-such-file @webserver;
    }

    location /socket.io {
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header X-Frappe-Site-Name $host;
        proxy_set_header Origin $scheme://$http_host;
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
        set $cadro_socketio "socketio:9000";
        proxy_pass http://$cadro_socketio;
    }

    location / {
        rewrite ^(.+)/$ $1 permanent;
        rewrite ^(.+)\.html$ $1 permanent;

        location ~ ^/files/.*\.(htm|html|svg|xml) {
            add_header Content-disposition "attachment";
            try_files /$host/public/$uri @webserver;
        }

        try_files /$host/public/$uri @webserver;
    }

    location @webserver {
        proxy_http_version 1.1;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Frappe-Site-Name $host;
        proxy_set_header Host $http_host;
        proxy_set_header X-Use-X-Accel-Redirect True;
        proxy_read_timeout 120s;
        proxy_redirect off;
        set $cadro_backend "bench:8000";
        proxy_pass http://$cadro_backend;
    }
}
