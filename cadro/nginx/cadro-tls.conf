# CADRO TLS termination (enabled by cadro/docker-compose.tls.yml).
#
# Adds an HTTPS server next to the plain-HTTP one in cadro.conf (which stays on 8001 inside the
# network for the container health check and is not published when this file is used), and a
# port-80 listener that only redirects to HTTPS.
#
# Certificate and key: cadro/certs/fullchain.pem and cadro/certs/privkey.pem on the host
# (mounted read-only). Use a certificate from your CA for production;
# scripts/make_self_signed_cert.sh creates a self-signed one for staging.

server {
    listen 8080;
    server_name _;
    server_tokens off;
    return 301 https://$host$request_uri;
}

server {
    listen 8443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:cadro_tls:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    add_header Strict-Transport-Security "max-age=31536000" always;

    include /etc/nginx/cadro/cadro-server.inc;
}
