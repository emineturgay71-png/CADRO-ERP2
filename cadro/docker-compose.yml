# CADRO staging / pilot deployment
#
# Intended for evaluation and controlled pilot runs. It does NOT claim production readiness
# or high availability. Use the CADRO baseline pins, not upstream develop branches.
#
# Topology: nginx (public, :8001) -> bench (gunicorn) + socketio; worker and scheduler run
# the same image against the shared bench volume. MariaDB, Redis and nginx are pinned by
# digest.
#
# Prerequisites
#   cadro/.env                     SITE_NAME (e.g. cadro-pilot.localhost); git-ignored
#   cadro/secrets/db_password      MariaDB root password (git-ignored, generate once)
#   cadro/secrets/admin_password   Administrator password of the site (git-ignored)
#
# Run from the repository root:
#   docker compose -p cadro --project-directory . --env-file cadro/.env \
#     -f cadro/docker-compose.yml up -d --build

services:
  db:
    image: mariadb:11.8@sha256:e1d5495f445654134f226f55a41ce0da227116f6f27f283101f405c794d841fc
    container_name: cadro-db
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD_FILE: /run/secrets/db_password
    secrets:
      - db_password
    volumes:
      - db-data:/var/lib/mysql
      - ./cadro/mariadb/conf.d:/etc/mysql/conf.d:ro
    healthcheck:
      test: ["CMD", "mariadb-admin", "ping", "--silent"]
      interval: 10s
      retries: 5
      start_period: 30s
    networks:
      - cadro-net

  redis-cache:
    image: &redis-image redis:7-alpine@sha256:7f7d30b7fdd09467bac58198a1f166dd69789d348d4fe859cccb20e0cf287fbe
    container_name: cadro-redis-cache
    restart: unless-stopped
    command: redis-server --appendonly no --save ""
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      retries: 3
    networks:
      - cadro-net

  redis-queue:
    image: *redis-image
    container_name: cadro-redis-queue
    restart: unless-stopped
    command: redis-server --appendonly no --save ""
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      retries: 3
    networks:
      - cadro-net

  redis-socketio:
    image: *redis-image
    container_name: cadro-redis-socketio
    restart: unless-stopped
    command: redis-server --appendonly no --save ""
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      retries: 3
    networks:
      - cadro-net

  # Provisions / updates the bench, then serves the application with gunicorn.
  bench:
    build:
      context: .
      dockerfile: cadro/Dockerfile
      args:
        - PYTHON_VERSION=3.14
    image: cadro-bench:eval
    container_name: cadro-bench
    restart: unless-stopped
    command: ["cadro-web"]
    depends_on:
      db:
        condition: service_healthy
      redis-cache:
        condition: service_healthy
      redis-queue:
        condition: service_healthy
      redis-socketio:
        condition: service_healthy
    environment: &bench-env
      DB_HOST: db
      DB_PORT: "3306"
      DB_PASSWORD_FILE: /run/secrets/db_password
      ADMIN_PASSWORD_FILE: /run/secrets/admin_password
      SITE_NAME: ${SITE_NAME:?required}
      CADRO_LANGUAGE: ${CADRO_LANGUAGE:-tr}
      CADRO_COUNTRY: ${CADRO_COUNTRY:-Türkiye}
      CADRO_TIME_ZONE: ${CADRO_TIME_ZONE:-Europe/Istanbul}
    secrets:
      - db_password
      - admin_password
    expose:
      - "8000"
    volumes:
      - bench-data:/home/frappe/cadro-data
    mem_limit: 3g
    mem_reservation: 1g
    healthcheck:
      test: ["CMD", "python", "scripts/healthcheck.py", "--site", "${SITE_NAME:?required}"]
      interval: 30s
      retries: 10
      start_period: 600s
      timeout: 20s
    networks:
      - cadro-net

  socketio:
    image: cadro-bench:eval
    container_name: cadro-socketio
    restart: unless-stopped
    command: ["cadro-socketio"]
    depends_on:
      redis-socketio:
        condition: service_healthy
    environment: *bench-env
    secrets:
      - db_password
      - admin_password
    expose:
      - "9000"
    volumes:
      - bench-data:/home/frappe/cadro-data
    mem_limit: 512m
    networks:
      - cadro-net

  worker:
    image: cadro-bench:eval
    container_name: cadro-worker
    restart: unless-stopped
    command: ["cadro-worker"]
    depends_on:
      db:
        condition: service_healthy
      redis-queue:
        condition: service_healthy
    environment: *bench-env
    secrets:
      - db_password
      - admin_password
    volumes:
      - bench-data:/home/frappe/cadro-data
    mem_limit: 2g
    networks:
      - cadro-net

  scheduler:
    image: cadro-bench:eval
    container_name: cadro-scheduler
    restart: unless-stopped
    command: ["cadro-scheduler"]
    depends_on:
      db:
        condition: service_healthy
      redis-queue:
        condition: service_healthy
    environment: *bench-env
    secrets:
      - db_password
      - admin_password
    volumes:
      - bench-data:/home/frappe/cadro-data
    mem_limit: 512m
    networks:
      - cadro-net

  # Public entry point: static assets and files, application and realtime proxy.
  nginx:
    image: nginx:1.27-alpine@sha256:65645c7bb6a0661892a8b03b89d0743208a18dd2f3f17a54ef4b76fb8e2f2a10
    container_name: cadro-nginx
    restart: unless-stopped
    depends_on:
      bench:
        condition: service_started
    ports:
      - "8001:8001"
    volumes:
      - bench-data:/home/frappe/cadro-data:ro
      - ./cadro/nginx/cadro.conf:/etc/nginx/conf.d/default.conf:ro
    healthcheck:
      test: ["CMD", "wget", "-qO-", "--header=Host: ${SITE_NAME:?required}", "http://127.0.0.1:8001/api/method/ping"]
      interval: 30s
      retries: 5
      start_period: 30s
    networks:
      cadro-net:
        # Frappe's socket.io server calls back the browser's origin to authorise a session;
        # the site name must therefore resolve to nginx inside the network.
        aliases:
          - ${SITE_NAME:?required}

secrets:
  db_password:
    file: ./cadro/secrets/db_password
  admin_password:
    file: ./cadro/secrets/admin_password

volumes:
  db-data:
  bench-data:

networks:
  cadro-net:
    driver: bridge
